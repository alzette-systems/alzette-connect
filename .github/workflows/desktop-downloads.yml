name: Desktop Downloads

on:
  workflow_dispatch:
    inputs:
      version:
        description: Demo build version (for example 0.2.0-demo.2)
        required: true
        default: 0.2.0-demo.1
        type: string
      platform:
        description: Platforms to package
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
      publish:
        description: Publish packages as an unsigned demo prerelease
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'connect-v*-demo.*'
      - 'connect-windows-v*-demo.*'

permissions:
  contents: read

concurrency:
  group: desktop-downloads-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.label }} downloadable package
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.platform == 'windows' || startsWith(github.ref_name, 'connect-windows-v')) && '[{"os":"windows-2025","label":"Windows x64"}]' || '[{"os":"ubuntu-24.04","label":"Linux x64"},{"os":"macos-15","label":"macOS arm64"},{"os":"macos-15-intel","label":"macOS x64"},{"os":"windows-2025","label":"Windows x64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      ALZETTE_CONNECT_VERSION: ${{ inputs.version || github.ref_name }}
      # This workflow produces explicitly unsigned internal demo packages.
      # Production release workflows must omit this until named acceptance.
      ALZETTE_CONNECT_CHATGPT_CANDIDATE: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate demo version
        run: |
          version="${ALZETTE_CONNECT_VERSION#connect-windows-v}"
          version="${version#connect-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-demo\.[0-9]+$ ]]
          printf 'ALZETTE_CONNECT_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux native packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libsecret-tools

      - name: Install Windows installer tooling
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Install pinned Wails CLI
        run: scripts/install-wails.sh

      - name: Verify source and tests
        run: scripts/verify.sh

      - name: Build application
        run: scripts/build-smoke.sh

      - name: Assemble native-shaped download
        run: scripts/package-download.sh --from-build

      - name: Upload downloadable package
        uses: actions/upload-artifact@v7
        with:
          name: alzette-connect-${{ runner.os }}-${{ runner.arch }}-unsigned-demo
          path: |
            dist/Alzette-Connect-*
          if-no-files-found: error
          retention-days: 30

      - name: Attest demo package provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/Alzette-Connect-*

      - name: Explain release boundary
        run: |
          printf '%s\n' \
            '### ${{ matrix.label }} package ready' \
            '' \
            'This is an **unsigned internal demo** download. Production publication remains blocked on platform signing/notarization and clean-machine acceptance.' \
            >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish integrity-checked demo release
    if: startsWith(github.ref, 'refs/tags/connect-v') || startsWith(github.ref, 'refs/tags/connect-windows-v') || inputs.publish
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packaged builds
        uses: actions/download-artifact@v8
        with:
          pattern: alzette-connect-*-unsigned-demo
          path: dist
          merge-multiple: true

      - name: Publish immutable-version demo downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${RELEASE_VERSION#connect-windows-v}"
          version="${version#connect-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-demo\.[0-9]+$ ]]
          tag="connect-v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists; refusing to replace immutable assets" >&2
            exit 1
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Alzette Connect $version" \
              --notes "Unsigned internal demo. Downloads are SHA-256 verified by Connect and carry GitHub build-provenance attestations. macOS notarization and Windows publisher signing are not yet complete." \
              --prerelease
          fi

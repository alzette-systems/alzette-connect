version: '3'

info:
  companyName: Alzette Systems
  productName: Alzette Connect
  productIdentifier: systems.alzette.Connect
  description: Securely connects supported desktop AI clients to company-authorised Alzette models.
  copyright: Copyright 2026 DUCHENE S.a r.l.-S
  comments: Alzette Connect desktop companion
  version: 0.1.0

dev_mode:
  root_path: .
  log_level: warn
  debounce: 700
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - '*_test.go'
    watched_extension:
      - '*.go'
      - '*.js'
      - '*.css'
      - '*.html'
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

fileAssociations: []
